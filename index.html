<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0f14" />
<title>AI HTML 工坊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="topbar">
  <div class="brand"><span class="logo">🎨</span>AI HTML 工坊</div>
  <div class="actions">
    <button id="btn-files" class="icon-btn" title="文件库">🗂️</button>
    <button id="btn-settings" class="icon-btn" title="设置">⚙️</button>
  </div>
</header>

<main id="chat"><div id="messages"></div></main>

<footer id="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="说点什么，或让它写个网页…"></textarea>
    <button id="btn-send" title="发送">➤</button>
  </div>
</footer>

<!-- 全屏预览：右上角 复制 / 下载 / 返回 -->
<div id="preview" class="overlay hidden">
  <div class="preview-bar">
    <span id="pv-name" class="pv-name"></span>
    <div class="pv-actions">
      <button id="pv-copy">📋 复制</button>
      <button id="pv-download">⬇️ 下载</button>
      <button id="pv-back">✕ 返回</button>
    </div>
  </div>
  <iframe id="pv-frame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
</div>

<!-- 设置 -->
<div id="settings" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><h2>设置</h2><button class="close" data-close="settings">✕</button></div>
    <div class="sheet-body">
      <section class="field">
        <label>API 供应商</label>
        <div id="provider-list"></div>
        <button id="btn-add-provider" class="ghost">＋ 添加供应商</button>
      </section>
      <section class="field">
        <label>系统提示词（可选）</label>
        <textarea id="sys-prompt" rows="3" placeholder="例：你是前端工程师，每次都输出完整单文件 HTML"></textarea>
      </section>
      <div class="row end">
        <button id="btn-clear-chat" class="ghost danger">清空当前对话</button>
      </div>
    </div>
  </div>
</div>

<!-- 文件库 -->
<div id="files" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><h2>文件库</h2><button class="close" data-close="files">✕</button></div>
    <div id="file-list" class="sheet-body"></div>
  </div>
</div>

<!-- 供应商编辑 -->
<div id="provider-edit" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><h2 id="pe-title">添加供应商</h2><button class="close" data-close="provider-edit">✕</button></div>
    <div class="sheet-body">
      <section class="field">
        <label>快速选择</label>
        <div id="presets" class="presets"></div>
      </section>
      <section class="field"><label>名称</label><input id="pe-name" placeholder="例如：DeepSeek" /></section>
      <section class="field"><label>Base URL</label><input id="pe-base" placeholder="https://api.deepseek.com/v1" /></section>
      <section class="field"><label>API Key</label><input id="pe-key" type="password" placeholder="sk-…" /></section>
      <section class="field">
        <label>模型</label>
        <div class="row">
          <select id="pe-model"></select>
          <button id="btn-fetch-models" class="ghost">拉取模型</button>
        </div>
      </section>
      <div class="row between">
        <button id="pe-delete" class="ghost danger" hidden>删除</button>
        <button id="pe-save">保存</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>

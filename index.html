<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f6fb" />
<title>AI HTML 工坊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%236d5ae6'/%3E%3Ccircle cx='9' cy='9.5' r='1.7' fill='%23fff'/%3E%3Ccircle cx='14.6' cy='8.6' r='1.7' fill='%23fff'/%3E%3Ccircle cx='10' cy='14.6' r='1.7' fill='%23fff'/%3E%3C/svg%3E" />
<script>try{var t=localStorage.getItem('aih.theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="style.v5.css" />
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-palette" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="14.5" r="1.3" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M5.2 18.8l1.4-1.4M17.4 6.6l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4.2l2 2.5H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19.5H5a1.5 1.5 0 0 1-1.5-1.5z"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h8M17.5 7H20M4 17h2.5M12 17h8"/><circle cx="14.8" cy="7" r="2.3"/><circle cx="9.2" cy="17" r="2.3"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M21.5 2.5 11 13"/><path d="M21.5 2.5 14.7 21.5l-3.7-8.5L2.5 9.3z"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5.5 15H4.8A1.8 1.8 0 0 1 3 13.2V4.8A1.8 1.8 0 0 1 4.8 3h8.4A1.8 1.8 0 0 1 15 4.8v.7"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v3.5A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5V15"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3.5 6.5h17M8.5 6.5V4.8A1.8 1.8 0 0 1 10.3 3h3.4a1.8 1.8 0 0 1 1.8 1.8v1.7M18.8 6.5 18 19.2a1.8 1.8 0 0 1-1.8 1.8H7.8A1.8 1.8 0 0 1 6 19.2L5.2 6.5"/><path d="M10 11v5.5M14 11v5.5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.7 3.3a2.1 2.1 0 0 1 3 3L7.5 18.5 3.5 19.5l1-4z"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.1 1 1.9v.3h5.2v-.3c0-.8.4-1.4 1-1.9A6 6 0 0 0 12 3z"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9z"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"/><path d="M19 16.5v3M17.5 18h3"/></symbol>
</defs>
</svg>

<header id="topbar">
  <div class="brand">
    <svg class="ic logo"><use href="#i-palette"/></svg>
    <span>AI HTML 工坊</span>
    <span class="ver">v5</span>
  </div>
  <div class="actions">
    <button id="btn-theme" class="icon-btn" title="切换主题"><svg class="ic"><use href="#i-moon"/></svg></button>
    <button id="btn-files" class="icon-btn" title="文件库"><svg class="ic"><use href="#i-folder"/></svg></button>
    <button id="btn-settings" class="icon-btn" title="设置"><svg class="ic"><use href="#i-gear"/></svg></button>
  </div>
</header>

<main id="chat"><div id="messages"></div></main>

<footer id="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="说点什么，或让它写个网页…"></textarea>
    <button id="btn-send" title="发送"><svg class="ic"><use href="#i-send"/></svg></button>
  </div>
</footer>

<!-- 全屏预览：右上角 复制 / 下载 / 返回 -->
<div id="preview" class="overlay hidden">
  <div class="preview-bar">
    <span id="pv-name" class="pv-name"></span>
    <div class="pv-actions">
      <button id="pv-copy"><svg class="ic"><use href="#i-copy"/></svg><span class="lbl">复制</span></button>
      <button id="pv-download"><svg class="ic"><use href="#i-download"/></svg><span class="lbl">下载</span></button>
      <button id="pv-back"><svg class="ic"><use href="#i-x"/></svg><span class="lbl">返回</span></button>
    </div>
  </div>
  <iframe id="pv-frame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
</div>

<!-- 设置 -->
<div id="settings" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><h2>设置</h2><button class="close" data-close="settings"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="sheet-body">
      <section class="field">
        <label>API 供应商</label>
        <div id="provider-list"></div>
        <button id="btn-add-provider" class="ghost"><svg class="ic"><use href="#i-plus"/></svg>添加供应商</button>
      </section>
      <section class="field">
        <label>系统提示词（可选）</label>
        <textarea id="sys-prompt" rows="3" placeholder="例：你是前端工程师，每次都输出完整单文件 HTML"></textarea>
      </section>
      <div class="row end">
        <button id="btn-clear-chat" class="ghost danger">清空当前对话</button>
      </div>
    </div>
  </div>
</div>

<!-- 文件库 -->
<div id="files" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><h2>文件库</h2><button class="close" data-close="files"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div id="file-list" class="sheet-body"></div>
  </div>
</div>

<!-- 供应商编辑 -->
<div id="provider-edit" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head"><h2 id="pe-title">添加供应商</h2><button class="close" data-close="provider-edit"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="sheet-body">
      <section class="field">
        <label>快速选择</label>
        <div id="presets" class="presets"></div>
      </section>
      <section class="field"><label>名称</label><input id="pe-name" placeholder="例如：DeepSeek" /></section>
      <section class="field"><label>Base URL</label><input id="pe-base" placeholder="https://api.deepseek.com/v1" /></section>
      <section class="field"><label>API Key</label><input id="pe-key" type="password" placeholder="sk-…" /></section>
      <section class="field">
        <label>模型</label>
        <div class="row">
          <select id="pe-model"></select>
          <button id="btn-fetch-models" class="ghost">拉取模型</button>
        </div>
      </section>
      <section class="field">
        <label>推理模式</label>
        <select id="pe-reasoning">
          <option value="default">默认（跟随模型，不额外传参）</option>
          <option value="off">关闭思考</option>
          <option value="low">开启 · 低强度</option>
          <option value="medium">开启 · 中强度</option>
          <option value="high">开启 · 高强度</option>
        </select>
      </section>
      <div class="row between">
        <button id="pe-delete" class="ghost danger" hidden>删除</button>
        <button id="pe-save">保存</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.v5.js"></script>
</body>
</html>
